name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch or PR supersedes the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  GBDK_VERSION: "4.3.0"
  GBDK_SHA256: "5032e4e4edcef3f0ed232c895bbd211973963329304ff2c030ea34d0b2d964a4"

jobs:
  test:
    name: Build ROM + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache GBDK-2020
        id: gbdk-cache
        uses: actions/cache@v4
        with:
          path: /opt/gbdk
          key: gbdk-${{ env.GBDK_VERSION }}-linux64

      - name: Install GBDK-2020
        if: steps.gbdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/gbdk.tar.gz \
            "https://github.com/gbdk-2020/gbdk-2020/releases/download/${GBDK_VERSION}/gbdk-linux64.tar.gz"
          echo "${GBDK_SHA256}  /tmp/gbdk.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gbdk.tar.gz -C /opt
          /opt/gbdk/bin/lcc -v || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install PyBoy (headless Game Boy emulator for ROM tests)
        run: pip install pyboy pillow numpy

      - name: Generated sources match their inputs (art, music, levels)
        run: |
          python3 tools/gen_assets.py
          python3 tools/gen_music.py
          python3 tools/gen_levels.py
          git diff --exit-code -- src || {
            echo "::error::Generated sources are stale: run make assets / gen_music / gen_levels and commit"
            exit 1
          }

      - name: Host tests (stage generator, physics bot, sound engine)
        run: make test-host

      - name: Asset pipeline tests
        run: make test-assets

      - name: Build ROM
        run: |
          # one build date for the ROM's title screen and the release tag
          echo "BUILD_DATE=$(date -u +%Y.%m.%d)" >> "$GITHUB_ENV"
          mkdir -p build
          date -u +%Y.%m.%d > build/build-date.txt
          make rom BUILD_DATE="$(cat build/build-date.txt)"

      - name: "Emulator tests (DMG + CGB): every sector played with the bot's inputs, frame budget checked"
        run: make test-rom

      - name: Screenshots and sector maps
        run: make screenshots

      - name: Stage generator statistics
        run: build/msgen stats 50 60 | tail -n 3

      - name: Upload ROM and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: alignment-${{ github.sha }}
          path: |
            build/alignment.gb
            build/alignment.sym
            build/build-date.txt
            build/screens/*.png
            docs/screens/*.png
            docs/screens/*.gif
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release (date-stamped, latest only)
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: alignment-${{ github.sha }}
          path: dist

      - name: Publish release and prune all older ones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # A slower run for an older push must never replace a newer release.
          HEAD_SHA="$(git ls-remote origin "refs/heads/${DEFAULT_BRANCH}" | cut -f1)"
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping release: ${GITHUB_SHA::7} is no longer the head of ${DEFAULT_BRANCH} (${HEAD_SHA::7})"
            exit 0
          fi

          TAG="$(cat dist/build-date.txt)"
          ROM="dist/alignment-${TAG}.gb"
          cp dist/alignment.gb "$ROM"

          cat > notes.md <<NOTES
          **ALIGNMENT** build ${TAG} (commit ${GITHUB_SHA::7}).

          Copy \`alignment-${TAG}.gb\` to your EverDrive SD card, see
          [docs/EVERDRIVE.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/EVERDRIVE.md).
          Runs on DMG, Pocket, Color, and GBC-compatible handhelds (colour + double speed on CGB).
          The title screen shows the build date, so you can tell which build is on the cart.

          **Controls:** A jump, B fire, Up+A flip gravity, Start pause.
          \`alignment.sym\` is the symbol file for emulator debuggers (BGB, Emulicious, SameBoy).
          NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            # An earlier build from today: swap its files and move its tag in place, so
            # there is never a moment with no release.
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/${TAG}"
            gh release upload "$TAG" "$ROM" dist/alignment.sym --clobber
            gh release edit "$TAG" --title "Alignment ${TAG}" --notes-file notes.md --latest
          else
            gh release create "$TAG" "$ROM" dist/alignment.sym \
              --target "$GITHUB_SHA" \
              --title "Alignment ${TAG}" \
              --notes-file notes.md \
              --latest
          fi

          # Only the latest release is kept.
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r old; do
            [ "$old" = "$TAG" ] && continue
            echo "Deleting release $old"
            gh release delete "$old" --yes --cleanup-tag
          done
